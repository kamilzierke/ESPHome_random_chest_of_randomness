esphome:
  name: esphome-web-98ba44
  friendly_name: ESPHome Web 98ba44
  min_version: 2025.9.0
  name_add_mac_suffix: false
  includes:
    - custom_components/lvgl_benchmark/lvgl_benchmark_component.h
  libraries:
    - lvgl/lvgl@^8.3.11
    - moononournation/Arduino_GFX_Library@^1.4.10

esp32:
  variant: esp32s3
  flash_size: 4MB
  framework:
    type: arduino
  psram: true

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "esphome-web-98ba44"
    password: "change_me_1234"

captive_portal:

power_supply:
  - id: display_backlight
    pin: GPIO1
    enable_time: 20ms
    keep_on_time: 0ms

spi:
  - id: qspi_bus
    type: quad
    clk_pin: GPIO47
    data_pins:
      - GPIO21
      - GPIO48
      - GPIO40
      - GPIO39

custom_component:
  - lambda: |-
      auto comp = new esphome::lvgl_benchmark::LvglBenchmarkComponent(/*backlight_pin=*/1, /*cs=*/45, /*clk=*/47,
                                                                      /*d0=*/21, /*d1=*/48, /*d2=*/40, /*d3=*/39);
      return {comp};

