########################################################
# INTERVAL UPDATES
########################################################

interval:
  - interval: 1s
    then:
      - lvgl.label.update:
          id: time_label
          text: !lambda |-
            static char time_str[20];
            auto time = id(homeassistant_time).now();
            snprintf(time_str, sizeof(time_str), "%02d:%02d:%02d", 
                     time.hour, time.minute, time.second);
            return time_str;
      
      - lvgl.label.update:
          id: date_label
          text: !lambda |-
            static char date_str[20];
            auto time = id(homeassistant_time).now();
            snprintf(date_str, sizeof(date_str), "%04d-%02d-%02d", 
                     time.year, time.month, time.day_of_month);
            return date_str;
      
      - lvgl.label.update:
          id: ip_label
          text: !lambda |-
            static char ip_str[30];
            snprintf(ip_str, sizeof(ip_str), "IP: %s", 
                     id(wifi_ip).state.c_str());
            return ip_str;
      
      - lvgl.label.update:
          id: ssid_label
          text: !lambda |-
            static char ssid_str[50];
            snprintf(ssid_str, sizeof(ssid_str), "WiFi: %s", 
                     id(wifi_ssid_name).state.c_str());
            return ssid_str;
      
      - lvgl.label.update:
          id: uptime_label
          text: !lambda |-
            static char uptime_str[50];
            int seconds = (int)id(uptime_sensor).state;
            int days = seconds / 86400;
            int hours = (seconds % 86400) / 3600;
            int minutes = (seconds % 3600) / 60;
            int secs = seconds % 60;
            
            if (days > 0) {
              snprintf(uptime_str, sizeof(uptime_str), "Uptime: %dd %dh %dm", 
                       days, hours, minutes);
            } else if (hours > 0) {
              snprintf(uptime_str, sizeof(uptime_str), "Uptime: %dh %dm %ds", 
                       hours, minutes, secs);
            } else {
              snprintf(uptime_str, sizeof(uptime_str), "Uptime: %dm %ds", 
                       minutes, secs);
            }
            return uptime_str;
      
      - lvgl.label.update:
          id: brightness_label
          text: !lambda |-
            static char brightness_str[30];
            auto brightness_light = id(backlight).current_values;
            int brightness = (int)(brightness_light.get_brightness() * 100);
            snprintf(brightness_str, sizeof(brightness_str), "Podswietlenie: %d%%", 
                     brightness);
            return brightness_str;

      - lvgl.label.update:
          id: ina226_label_current
          text: !lambda |-
            static char buf[32];
            float v = id(ina226_current).state;
            snprintf(buf, sizeof(buf), "I: %.3f A", v);
            return buf;

      - lvgl.label.update:
          id: ina226_label_bus_voltage
          text: !lambda |-
            static char buf[32];
            float v = id(ina226_bus_voltage).state;
            snprintf(buf, sizeof(buf), "Ubus: %.2f V", v);
            return buf;

      - lvgl.label.update:
          id: ina226_label_power
          text: !lambda |-
            static char buf[32];
            float v = id(ina226_power).state;
            snprintf(buf, sizeof(buf), "P: %.3f W", v);
            return buf;

      - lvgl.label.update:
          id: ina226_label_shunt_voltage
          text: !lambda |-
            static char buf[32];
            float v = id(ina226_shunt_voltage).state * 1000.0f;
            snprintf(buf, sizeof(buf), "Vshunt: %.2f mV", v);
            return buf;

      - lvgl.label.update:
          id: lbl_wifi_dbm
          text: !lambda |-
            static char buf[16];
            float v = id(wifi_signal_db).state;
            if (isnan(v)) {
              snprintf(buf, sizeof(buf), "-- dBm");
            } else {
              snprintf(buf, sizeof(buf), "%.0f dBm", v);
            }
            return buf;

      - lvgl.label.update:
          id: lbl_wifi_percent
          text: !lambda |-
            static char buf[16];
            float v = id(wifi_signal_percent).state;
            if (isnan(v)) {
              snprintf(buf, sizeof(buf), "-- %%");
            } else {
              if (v < 0) v = 0;
              if (v > 100) v = 100;
              snprintf(buf, sizeof(buf), "%.0f%%", v);
            }
            return buf;




  - interval: 1s
    then:
      - lambda: |-
          if (id(screen_sleep_secs_left) > 0) {
            id(screen_sleep_secs_left)--;
          }
      - if:
          condition:
            lambda: 'return id(screen_sleep_secs_left) == 0;'
          then:
            - light.turn_off:
                id: backlight
            - lvgl.pause:
                show_snow: true


########################################################
# SWITCHES / BUTTONS
########################################################

switch:
  - platform: shutdown
    name: "Shutdown"

  - platform: safe_mode
    name: "Restart (Safe Mode)"

  - platform: restart
    name: "Restart"

  - platform: template
    name: Antiburn
    id: switch_antiburn
    icon: mdi:television-shimmer
    optimistic: true
    entity_category: "config"
    turn_on_action:
      - logger.log: "Starting Antiburn"
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
      - lvgl.pause:
          show_snow: true
    turn_off_action:
      - logger.log: "Stopping Antiburn"
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:

button:
  - platform: shutdown
    name: "Shutdown"

  - platform: safe_mode
    name: "Restart (Safe Mode)"

  - platform: restart
    name: "Restart"
