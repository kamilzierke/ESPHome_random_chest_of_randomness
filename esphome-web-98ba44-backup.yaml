########################################################
# ESPHOME / PLATFORM CONFIGURATION
########################################################

esphome:
  name: esphome-web-98ba44
  friendly_name: Guition JC4827W543-C
  min_version: 2025.9.0
  name_add_mac_suffix: false
  on_boot:
    priority: -100
    then:
      - script.execute: wake_display
    
esp32:
  variant: esp32s3
  flash_size: 4MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

########################################################
# LOGGING / API / OTA / WIFI / MISC
########################################################

logger:

api:
  on_client_connected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - lvgl.widget.show: lbl_hastatus
          - lambda: |-
              id(last_ha_connection) = id(homeassistant_time).now().timestamp;
  on_client_disconnected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - lvgl.widget.hide: lbl_hastatus
ota:
  - platform: esphome



wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "esphome-web-98ba44"
    password: "change_me_1234"

captive_portal:

web_server:
  port: 80
  version: 3
  

########################################################
# TIME / DEBUG / GLOBALS / SCRIPTS / NUMBER
########################################################

time:
  - platform: homeassistant
    timezone: Europe/Warsaw
    id: homeassistant_time
  - platform: sntp
    id: sntp_time
    on_time:
      - hours: 2,3,4,5
        minutes: 5
        seconds: 0
        then:
          - switch.turn_on: switch_antiburn
      - hours: 2,3,4,5
        minutes: 35
        seconds: 0
        then:
          - switch.turn_off: switch_antiburn

debug:
  update_interval: 5s

globals:
  # Configurable screen sleep time (seconds)
  - id: screen_sleep_secs_cfg
    type: int
    restore_value: yes
    initial_value: '60'

  # Remaining time until sleep (seconds)
  - id: screen_sleep_secs_left
    type: int
    restore_value: no
    initial_value: '60'

  # Last successful HA API connection timestamp
  - id: last_ha_connection
    type: int32_t
    restore_value: no
    initial_value: '0'

  # Current active page (0=main, 1=news)
  - id: current_page
    type: int
    restore_value: no
    initial_value: '0'

script:
  - id: wake_display
    mode: restart
    then:
      - lambda: |-
          id(screen_sleep_secs_left) = id(screen_sleep_secs_cfg);
      - light.turn_on:
          id: backlight

  - id: show_battery_modal
    mode: restart
    then:
      - lvgl.widget.show: modal_battery_bg
      - lvgl.widget.redraw: modal_battery_bg

  - id: hide_battery_modal
    mode: restart
    then:
      - lvgl.widget.hide: modal_battery_bg

  - id: show_api_modal
    mode: restart
    then:
      - lvgl.widget.show: modal_api_bg
      - lvgl.widget.redraw: modal_api_bg

  - id: hide_api_modal
    mode: restart
    then:
      - lvgl.widget.hide: modal_api_bg

  - id: switch_to_main_page
    mode: restart
    then:
      - lambda: |-
          id(current_page) = 0;
      - lvgl.page.show:
          id: page_main

  - id: switch_to_news_page
    mode: restart
    then:
      - lambda: |-
          id(current_page) = 1;
      - lvgl.page.show:
          id: page_news

number:
  - platform: template
    id: screen_sleep_cfg_number
    name: "Ekran: czas uspienia [s]"
    min_value: 5
    max_value: 600
    step: 5
    optimistic: true
    restore_value: true
    initial_value: 60
    set_action:
      - lambda: |-
          id(screen_sleep_secs_cfg) = (int)x;
          id(screen_sleep_secs_left) = id(screen_sleep_secs_cfg);
      - light.turn_on:
          id: backlight


########################################################
# BINARY SENSORS
########################################################

binary_sensor:
  - platform: status
    name: "Status"
    device_class: connectivity

  # (opcjonalnie zostawiasz lub usuwasz ten z HA)
  - platform: homeassistant
    id: charger_connected
    entity_id: binary_sensor.device_charging

  # NOWY: ładowanie na podstawie INA226
  - platform: template
    id: charger_charging_from_ina
    name: "Device Charging (INA226)"
    device_class: battery_charging
    lambda: |-
      const float i = id(ina226_current).state;
      if (isnan(i)) {
        // Brak sensownych danych -> traktujemy jako nieładowanie
        return false;
      }
      // i < 0  -> rozładowywanie
      // i >= 0 -> podłaczone / ładowanie
      return i >= 0.0f;



########################################################
# TEXT SENSORS
########################################################

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: wifi_ip
    ssid:
      name: "WiFi SSID"
      id: wifi_ssid_name

  - platform: debug
    device:
      name: "Device Info"
    reset_reason:
      name: "Reset Reason"

  - platform: version
    name: "Version"
    icon: mdi:cube-outline

  - platform: template
    name: Uptime Human Readable
    id: uptime_human
    icon: mdi:clock-start
    entity_category: "diagnostic"

  - platform: wifi_info
    ip_address:
      name: ESP IP Address
      id: ESP_IP
      entity_category: "diagnostic"
    ssid:
      name: ESP Connected SSID
      id: ESP_SSID
      entity_category: "diagnostic"
    bssid:
      name: ESP Connected BSSID
      entity_category: "diagnostic"
    mac_address:
      name: ESP Mac Wifi Address
      entity_category: "diagnostic"

  - platform: template
    name: ESP IP Address Last Fragment
    id: esp_ip_last_fragment
    internal: true
    lambda: |-
      const std::string& ipAddress = id(ESP_IP).state.c_str();
      size_t lastDotIndex = ipAddress.rfind('.');
      if (lastDotIndex != std::string::npos) {
        return ipAddress.substr(lastDotIndex + 1);
      }
      return esphome::nullopt;
      
text:
  - platform: lvgl
    name: fr_cond_icon
    widget: lbl_weather_forecast_condition_icon
    mode: text

  - platform: lvgl
    name: fr_cond_name
    widget: lbl_weather_forecast_condition_name
    mode: text

  - platform: lvgl
    name: fr_tempap
    widget: lbl_weather_forecast_tempap
    mode: text

  - platform: lvgl
    name: wd_out_now
    widget: lbl_weather_outdoor_now
    mode: text


########################################################
# SENSORS (BATTERY, INA226, DEBUG, WIFI, UPTIME)
########################################################

sensor:
  # Poziom baterii (OCV – przybliżenie)
  - platform: template
    id: battery_level
    name: "Battery Level"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    update_interval: 10s
    accuracy_decimals: 0
    lambda: |-
      const float v = id(ina226_bus_voltage).state;
      if (isnan(v)) return NAN;
      if (v <= 3.00f) return 0;
      if (v >= 4.20f) return 100;
      struct P { float v, p; } curve[] = {
        {3.00f, 0},
        {3.20f, 10},
        {3.50f, 30},
        {3.70f, 50},
        {3.85f, 70},
        {4.00f, 85},
        {4.10f, 93},
        {4.20f, 100}
      };
      for (int i = 1; i < (int)(sizeof(curve)/sizeof(curve[0])); i++) {
        if (v <= curve[i].v) {
          const float x0 = curve[i-1].v, y0 = curve[i-1].p;
          const float x1 = curve[i].v,   y1 = curve[i].p;
          return y0 + (v - x0) * (y1 - y0) / (x1 - x0);
        }
      }
      return 100.0f;
    on_value:
      - lvgl.label.update:
          id: lbl_battery_status
          text: !lambda |-
            static char buf[10];
            std::string icon;

            const float level = x;
            const bool charging = id(charger_charging_from_ina).state;

            if (isnan(level)) {
              icon = "\U000F0091";
            } else if (charging) {
              if (level >= 100.0f) {
                icon = "\U000F0085";
              } else if (level > 90.0f) {
                icon = "\U000F008B";
              } else if (level > 80.0f) {
                icon = "\U000F008A";
              } else if (level > 70.0f) {
                icon = "\U000F089E";
              } else if (level > 60.0f) {
                icon = "\U000F0089";
              } else if (level > 50.0f) {
                icon = "\U000F089D";
              } else if (level > 40.0f) {
                icon = "\U000F0088";
              } else if (level > 30.0f) {
                icon = "\U000F0087";
              } else if (level > 20.0f) {
                icon = "\U000F0086";
              } else if (level > 0.0f) {
                icon = "\U000F089C";
              } else {
                icon = "\U000F0091";
              }
            } else {
              if (level == 100.0f) {
                icon = "\U000F0079";
              } else if (level > 90.0f) {
                icon = "\U000F0082";
              } else if (level > 80.0f) {
                icon = "\U000F0081";
              } else if (level > 70.0f) {
                icon = "\U000F0080";
              } else if (level > 60.0f) {
                icon = "\U000F007F";
              } else if (level > 50.0f) {
                icon = "\U000F007E";
              } else if (level > 40.0f) {
                icon = "\U000F007D";
              } else if (level > 30.0f) {
                icon = "\U000F007C";
              } else if (level > 20.0f) {
                icon = "\U000F007B";
              } else if (level > 10.0f) {
                icon = "\U000F007A";
              } else if (level > 0.0f) {
                icon = "\U000F008E";
              } else {
                icon = "\U000F0091";
              }
            }

            snprintf(buf, sizeof(buf), "%s", icon.c_str());
            return buf;

      - lvgl.label.update:
          id: lbl_battery_percent
          text: !lambda |-
            static char buf[8];
            if (isnan(x)) {
              snprintf(buf, sizeof(buf), "--");
            } else {
              int level = (int) x;
              if (level < 0) level = 0;
              if (level > 100) level = 100;
              snprintf(buf, sizeof(buf), "%d%%", level);
            }
            return buf;

  - platform: template
    id: screen_sleep_left_sensor
    name: "Ekran: pozostały czas [s]"
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      return id(screen_sleep_secs_left);

  - platform: ina226
    i2c_id: i2c_b
    address: 0x40
    shunt_resistance: 0.1 ohm
    max_current: 3.2A
    adc_time: 140us
    adc_averaging: 128
    update_interval: 1s
    current:
      name: "INA226 Current"
      id: ina226_current
    power:
      name: "INA226 Power"
      id: ina226_power
    bus_voltage:
      name: "INA226 Bus Voltage"
      id: ina226_bus_voltage
    shunt_voltage:
      name: "INA226 Shunt Voltage"
      id: ina226_shunt_voltage

  - platform: debug
    free:
      name: "Heap Free"
    block:
      name: "Heap Max Block"
    loop_time:
      name: "Loop Time"
    psram:
      name: "Free PSRAM"
    cpu_frequency:
      name: "CPU Frequency"

  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    update_interval: 10s
    on_raw_value:
      then:
        - text_sensor.template.publish:
            id: uptime_human
            state: !lambda |-
              int seconds = round(id(uptime_sensor).raw_state);
              int days = seconds / (24 * 3600);
              seconds = seconds % (24 * 3600);
              int hours = seconds / 3600;
              seconds = seconds % 3600;
              int minutes = seconds /  60;
              seconds = seconds % 60;
              return (
                (days ? to_string(days) + "d " : "") +
                (hours ? to_string(hours) + "h " : "") +
                (minutes ? to_string(minutes) + "m " : "") +
                (to_string(seconds) + "s")
              ).c_str();  

  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 10s
    entity_category: "diagnostic"

  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    id: wifi_signal_percent
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"


########################################################
# I2C / SPI / OUTPUT / LIGHT
########################################################

i2c:
  - id: touch_i2c
    sda: GPIO8
    scl: GPIO4
    scan: true

  - id: i2c_b
    sda: GPIO18
    scl: GPIO17
    scan: true

spi:
  id: quad_spi
  type: quad
  clk_pin: GPIO47
  data_pins:
    # D0
    - GPIO21
    # D1
    - GPIO48
    # D2
    - GPIO40
    # D3
    - GPIO39

output:
  - platform: ledc
    pin: GPIO1
    id: backlight_output
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: backlight_output
    name: "Display Backlight"
    id: backlight
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 0s
    on_turn_on:
      then:
        - script.execute: wake_display


########################################################
# TOUCHSCREEN / DISPLAY
########################################################

touchscreen:
  - platform: gt911
    i2c_id: touch_i2c
    id: my_touchscreen
    interrupt_pin: GPIO3
    reset_pin: GPIO38
    on_touch:
      - script.execute: wake_display
      - lambda: |-
          ESP_LOGI("touch", "Touch at x=%d, y=%d", touch.x, touch.y);
    on_release:
      - if:
          condition: lvgl.is_paused
          then:
            - logger.log: "LVGL resuming"
            - lvgl.resume:
            - lvgl.widget.redraw:
            - light.turn_on: backlight

display:
  - platform: qspi_dbi
    model: CUSTOM
    id: main_display
    data_rate: 20MHz
    dimensions:
      width: 480
      height: 272
    cs_pin:
      number: GPIO45
      ignore_strapping_warning: true
    invert_colors: true
    rotation: 180
    auto_clear_enabled: false
    update_interval: never
    init_sequence:
