########################################################
# LVGL: STYLES, TOP LAYER (STATUS BAR), MAIN PAGE
########################################################

lvgl:
  displays:
    - main_display
  touchscreens:
    - my_touchscreen
  color_depth: 16
  buffer_size: 25%
  log_level: INFO
  
  style_definitions:
    - id: screen_style
      bg_color: 0x000000
      bg_opa: COVER
      text_color: 0xFFFFFF

    # Styl dla top layer (status bar)
    - id: top_layer_style
      text_color: 0xFFFFFF

  on_idle:
    timeout: !lambda "return (id(screen_sleep_secs_cfg) * 1000);"
    then:
      - logger.log: "LVGL is idle"
      - light.turn_off: backlight
      - lvgl.pause:
          show_snow: true        

  top_layer:
    widgets:
      # WiFi RSSI w dBm (najbardziej po lewej)
      - label:
          id: lbl_wifi_dbm
          align: TOP_RIGHT
          x: -190
          y: 5
          text_font: montserrat_12
          text: "-- dBm"
          styles: top_layer_style

      # WiFi w %
      - label:
          id: lbl_wifi_percent
          align: TOP_RIGHT
          x: -145
          y: 5
          text_font: montserrat_12
          text: "-- %"
          styles: top_layer_style

      # Ikona Wi-Fi / status HA
      - label:
          text: "\uF1EB"
          id: lbl_hastatus
          hidden: true
          align: TOP_RIGHT
          x: -100
          y: 5
          text_align: right
          styles: top_layer_style

      # Procent baterii
      - label:
          id: lbl_battery_percent
          align: TOP_RIGHT
          x: -60
          y: 5
          text_font: montserrat_12
          text: "--%"
          styles: top_layer_style

      # Ikona stanu baterii
      - label:
          id: lbl_battery_status
          align: TOP_RIGHT
          x: -5
          y: 5
          text_font: battery_icons_20
          text: "\U000F0091"
          styles: top_layer_style

          
      # OTA overlay (pełnoekranowy status OTA)
      - obj:
          id: ota_overlay
          hidden: true
          align: CENTER
          x: 0
          y: 0
          width: 480
          height: 272
          bg_color: 0x000000
          bg_opa: COVER
          text_color: 0xFFFFFF
          radius: 0
          border_width: 0
          pad_all: 20
          layout:
            type: FLEX
            flex_flow: COLUMN
            pad_row: 10
            flex_align_main: CENTER
            flex_align_cross: CENTER
          widgets:
            - label:
                id: ota_label_title
                text: "OTA Update"
                text_font: montserrat_16
                text_align: CENTER
            - label:
                id: ota_label_status
                text: "Waiting..."
                text_font: montserrat_12
                text_align: CENTER
            - bar:
                id: ota_progress_bar
                width: 300
                height: 10
                min_value: 0
                max_value: 100
                value: 0
                bg_color: 0x222222
                indicator:
                  bg_color: 0xFFFFFF




  pages:
    - id: main_page
      styles: screen_style
      widgets:
        # Zegar
        - label:
            id: time_label
            x: 10
            y: 10
            text: "00:00:00"
            text_color: 0xFFFFFF
            text_font: montserrat_32
        
        # Data
        - label:
            id: date_label
            x: 10
            y: 50
            text: "2025-01-01"
            text_color: 0xCCCCCC
            text_font: montserrat_16
        
        # IP Address
        - label:
            id: ip_label
            x: 10
            y: 80
            text: "IP: 0.0.0.0"
            text_color: 0xCCCCCC
            text_font: montserrat_12
        
        # WiFi SSID
        - label:
            id: ssid_label
            x: 10
            y: 100
            text: "WiFi: ---"
            text_color: 0xCCCCCC
            text_font: montserrat_12
        
        # Uptime
        - label:
            id: uptime_label
            x: 10
            y: 120
            text: "Uptime: 0s"
            text_color: 0xCCCCCC
            text_font: montserrat_12

        # INA226: tytuł
        - label:
            id: ina226_label_title
            x: 10
            y: 150
            text: "INA226"
            text_color: 0xFFFFFF
            text_font: montserrat_16

        # INA226: prad
        - label:
            id: ina226_label_current
            x: 10
            y: 170
            text: "I: 0.000 A"
            text_color: 0xCCCCCC
            text_font: montserrat_12

        # INA226: napiecie szyny
        - label:
            id: ina226_label_bus_voltage
            x: 10
            y: 190
            text: "Ubus: 0.00 V"
            text_color: 0xCCCCCC
            text_font: montserrat_12

        # INA226: moc
        - label:
            id: ina226_label_power
            x: 10
            y: 210
            text: "P: 0.000 W"
            text_color: 0xCCCCCC
            text_font: montserrat_12

        # INA226: napiecie shuntu
        - label:
            id: ina226_label_shunt_voltage
            x: 10
            y: 230
            text: "Vshunt: 0.00 mV"
            text_color: 0xCCCCCC
            text_font: montserrat_12

        # Slider podswietlenia
        - slider:
            id: brightness_slider
            x: 250
            y: 50
            width: 220
            height: 20
            min_value: 10
            max_value: 100
            value: 100
            on_value:
              then:
                - script.execute: wake_display                   
                - light.turn_on:
                    id: backlight
                    brightness: !lambda return x / 100.0;
                - lvgl.resume:
                - lvgl.widget.redraw:
    
        # Label dla slidera
        - label:
            id: brightness_label
            x: 250
            y: 30
            text: "Podswietlenie: 100%"
            text_color: 0xCCCCCC
            text_font: montserrat_12
        
        # Przycisk testowy
        - button:
            id: test_button
            x: 190
            y: 86
            width: 100
            height: 100
            bg_color: 0x2196F3
            on_press:
              then:
                - script.execute: wake_display 
                - logger.log: "Dotkniecie."
                - lvgl.widget.update:
                    id: test_button
                    bg_color: 0x4CAF50
                - lvgl.label.update:
                    id: button_label
                    text: "Ugh!"
            on_release:
              then:
                - script.execute: wake_display 
                - logger.log: "Button released!"
                - lvgl.widget.update:
                    id: test_button
                    bg_color: 0x2196F3
                - lvgl.label.update:
                    id: button_label
                    text: "Dotknij mnie!"
            widgets:
              - label:
                  id: button_label
                  text: "Dotknij mnie!"
                  text_color: 0xFFFFFF
                  align: CENTER

        #Pogoda
        - obj:
            align: BOTTOM_RIGHT
            x: -10
            y: -10
            width: 160
            height: 136
            pad_all: 5
            bg_color: 0x000000
            bg_opa: COVER
            text_color: 0xFFFFFF
            layout:
              pad_column: 0
