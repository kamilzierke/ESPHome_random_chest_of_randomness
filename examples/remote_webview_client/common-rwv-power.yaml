# Remote WebView power/backlight package.
#
# Include this package together with common-rwv-client.yaml. This file only
# handles display wake/sleep/backlight behavior. Remote WebView configuration
# and diagnostic entities live in separate packages.
#
# Required IDs in the host device YAML:
# - light: ${rwv_backlight_id}
#
# Recommended host hook:
#
# touchscreen:
#   - platform: ...
#     id: panel_touch
#     on_touch:
#       then:
#         - script.execute: rwv_touch_activity

substitutions:
  rwv_backlight_id: display_backlight
  rwv_idle_dim_after: "30s"
  rwv_idle_sleep_after: "60s"
  rwv_idle_sleep_after_dim: "30s"
  rwv_backlight_wake_brightness: "100%"
  rwv_backlight_dim_brightness: "25%"
  rwv_backlight_wake_transition: "500ms"
  rwv_backlight_dim_transition: "750ms"
  rwv_backlight_sleep_transition: "1s"
  # dim_then_off: dim first, then pause stream and turn the backlight off.
  # off: keep full brightness until sleep, then pause stream and turn off.
  rwv_sleep_mode: "dim_then_off"
  rwv_watchdog_interval: "30s"
  rwv_watchdog_missed_intervals: "0"

globals:
  - id: rwv_watchdog_last_frame_id
    type: uint32_t
    restore_value: false
    initial_value: "0xffffffffu"

  - id: rwv_watchdog_missed_count
    type: uint16_t
    restore_value: false
    initial_value: "0"

script:
  - id: rwv_idle_timer
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return std::string("${rwv_sleep_mode}") == "dim_then_off";
          then:
            - delay: ${rwv_idle_dim_after}
            - script.execute: rwv_dim
            - delay: ${rwv_idle_sleep_after_dim}
            - script.execute: rwv_sleep
          else:
            - delay: ${rwv_idle_sleep_after}
            - script.execute: rwv_sleep

  - id: rwv_dim
    mode: restart
    then:
      - light.turn_on:
          id: ${rwv_backlight_id}
          brightness: ${rwv_backlight_dim_brightness}
          transition_length: ${rwv_backlight_dim_transition}

  - id: rwv_sleep
    mode: restart
    then:
      - lambda: |-
          id(rwv).set_stream_paused(true);
      - light.turn_off:
          id: ${rwv_backlight_id}
          transition_length: ${rwv_backlight_sleep_transition}

  - id: rwv_wake
    mode: restart
    then:
      - light.turn_on:
          id: ${rwv_backlight_id}
          brightness: ${rwv_backlight_wake_brightness}
          transition_length: ${rwv_backlight_wake_transition}
      - lambda: |-
          id(rwv).set_stream_paused(false);
          id(rwv).request_full_frame();
      - script.execute: rwv_idle_timer

  - id: rwv_touch_activity
    mode: restart
    then:
      - script.execute: rwv_wake

interval:
  - interval: ${rwv_watchdog_interval}
    then:
      - lambda: |-
          const uint16_t limit = (uint16_t) ${rwv_watchdog_missed_intervals};
          if (limit == 0 || id(rwv).is_stream_paused()) {
            id(rwv_watchdog_missed_count) = 0;
            id(rwv_watchdog_last_frame_id) = id(rwv).get_last_frame_id();
            return;
          }

          const uint32_t current = id(rwv).get_last_frame_id();
          if (current == id(rwv_watchdog_last_frame_id)) {
            if (id(rwv_watchdog_missed_count) < 0xffff) {
              id(rwv_watchdog_missed_count)++;
            }
          } else {
            id(rwv_watchdog_missed_count) = 0;
            id(rwv_watchdog_last_frame_id) = current;
          }

          if (id(rwv_watchdog_missed_count) >= limit) {
            id(rwv_watchdog_missed_count) = 0;
            id(rwv).reconnect();
            id(rwv).request_full_frame();
          }
