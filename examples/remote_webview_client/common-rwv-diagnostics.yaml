# Remote WebView diagnostic entities and runtime controls.
#
# Include this package together with common-rwv-client.yaml. It extends the
# same `remote_webview:` component; do not duplicate `remote_webview:` in the
# device YAML.
#
# Note: `debug_overlay_switch` now sends debug overlay state to the server.
# The current server overlay draws tile/rect borders: blue for full-frame
# rects and amber for partial updates. Heatmaps and touch markers are planned
# as separate diagnostics work.

remote_webview:
  sensors:
    decode_avg_ms:
      name: "RWV Decode Avg"
    last_decode_ms:
      name: "RWV Last Decode"
    render_avg_ms:
      name: "RWV Render Avg"
    decode_drops:
      name: "RWV Decode Drops"
    unsupported_encoding_drops:
      name: "RWV Unsupported Encoding Drops"
    reconnect_count:
      name: "RWV Reconnect Count"
    last_frame_id:
      name: "RWV Last Frame ID"
    bytes_received:
      name: "RWV Bytes Received"
    frames_received:
      name: "RWV Frames Received"
    tiles_received:
      name: "RWV Tiles Received"
    fps:
      name: "RWV FPS"
    queue_depth:
      name: "RWV Queue Depth"

  binary_sensors:
    connected:
      name: "RWV Connected"
    stream_paused:
      name: "RWV Stream Paused"
    touch_enabled:
      name: "RWV Touch Enabled"

  controls:
    pause_switch:
      name: "RWV Pause Stream"
    touch_switch:
      name: "RWV Touch Enabled"
    request_keyframe_button:
      name: "RWV Request Keyframe"
    reconnect_button:
      name: "RWV Reconnect"
    debug_overlay_switch:
      name: "RWV Debug Overlay"
    render_mode_select:
      name: "RWV Render Mode"
      options:
        - jpeg
        - png
    jpeg_quality_number:
      name: "RWV JPEG Quality"
      min_value: 20
      max_value: 95
      step: 5
    min_frame_interval_number:
      name: "RWV Min Frame Interval"
      min_value: 0
      max_value: 1000
      step: 10
    tile_size_number:
      name: "RWV Tile Size"
      min_value: 16
      max_value: 256
      step: 16
