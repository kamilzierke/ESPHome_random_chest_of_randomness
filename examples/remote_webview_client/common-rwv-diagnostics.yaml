# Remote WebView diagnostic entities and runtime controls.
#
# Include this package together with common-rwv-client.yaml. It extends the
# same `remote_webview:` component; do not duplicate `remote_webview:` in the
# device YAML.
#
# Note: `debug_overlay_switch` is exposed as a future server-overlay control,
# but tile borders/change heatmaps still require the server debug overlay
# protocol work. It does not draw tile borders by itself today.

remote_webview:
  sensors:
    decode_avg_ms:
      name: "RWV Decode Avg"
    last_decode_ms:
      name: "RWV Last Decode"
    render_avg_ms:
      name: "RWV Render Avg"
    decode_drops:
      name: "RWV Decode Drops"
    reconnect_count:
      name: "RWV Reconnect Count"
    last_frame_id:
      name: "RWV Last Frame ID"
    bytes_received:
      name: "RWV Bytes Received"
    frames_received:
      name: "RWV Frames Received"
    tiles_received:
      name: "RWV Tiles Received"
    fps:
      name: "RWV FPS"
    queue_depth:
      name: "RWV Queue Depth"

  binary_sensors:
    connected:
      name: "RWV Connected"
    stream_paused:
      name: "RWV Stream Paused"
    touch_enabled:
      name: "RWV Touch Enabled"

  controls:
    pause_switch:
      name: "RWV Pause Stream"
    touch_switch:
      name: "RWV Touch Enabled"
    request_keyframe_button:
      name: "RWV Request Keyframe"
    reconnect_button:
      name: "RWV Reconnect"
    debug_overlay_switch:
      name: "RWV Debug Overlay"
